<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="card-image">
                <img class="img1" src="asset/Picture1.png" alt="Blog Image">
            </div>
            <div class="content">
                <div class="title">
                    <div class="title-text">Learning</div>
                </div>
                <div class="date">Published 21 Dec 2023</div>
                <div class="heading">HTML & CSS foundations</div>
                <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
            </div>
            <div class="author">
                <img src="asset/Picture2.png" alt="Author Avatar" class="avatar">
                <div class="author-name">Greg Hooper</div>
            </div>
        </div>
    </div>
</body>
</html>
